  <!-- Splash: vive aqui, e não no React, para aparecer antes do JavaScript
       carregar. O index.css só entra junto com o JS, então as cores da marca
       vão escritas à mão (petróleo #0f4c5c, petróleo escuro #0a3540, marfim
       #f8f7f4, verde-água #a8dccf). Quem a remove, aos 5 s, é o main.jsx.

       Roteiro:
         0,2 s  o brilho de fundo acende e o símbolo do B surge sozinho, no centro
         1,0 s  o símbolo desliza para a esquerda e a palavra "Brik" se desenrola
         2,0 s  a faixa de brilho cruza a logo (de novo aos 3,6 s)
         2,4 s  entra o "Garimpe ofertas"
         5,0 s  a logo cresce um pouco e a tela some
       Os estilos-base são o estado final; os keyframes descrevem só a chegada.
       Assim, com movimento reduzido, basta desligar as animações.

       Fluidez: tudo aqui anima só transform e opacity, que a GPU anima sozinha.
       Durante a splash a thread principal está ocupada (JS carregando, React
       montando, anúncios chegando); qualquer animação de background-position,
       clip-path, width etc. dependeria dela e engasgaria junto. -->
  <style>#splash{z-index:9999;background:radial-gradient(120% 80% at 50% 38%,#1d6173,#0f4c5c 55%,#0a3540);flex-direction:column;justify-content:center;align-items:center;font-family:Rubik,ui-sans-serif,system-ui,sans-serif;transition:opacity .5s,visibility .5s;display:flex;position:fixed;inset:0;overflow:hidden}#splash.splash-hide{opacity:0;visibility:hidden}.splash-blob{pointer-events:none;will-change:transform;border-radius:50%;animation:5s ease-in-out alternate both splash-drift;position:absolute}.splash-blob-a{background:radial-gradient(circle,#a8dccf52,#0000 65%);width:34rem;height:34rem;top:-18%;right:-30%}.splash-blob-b{background:radial-gradient(circle,#052218b3,#0000 65%);width:38rem;height:38rem;animation-direction:alternate-reverse;bottom:-22%;left:-35%}.splash-stage{justify-content:center;align-items:center;transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;position:relative}.splash-hide .splash-stage{transform:scale(1.08)}.splash-glow{pointer-events:none;will-change:transform, opacity;background:radial-gradient(circle,#a8dccf4d,#0000 62%);border-radius:50%;width:22rem;height:22rem;animation:1.2s cubic-bezier(.22,1,.36,1) .2s both splash-glow-in,2.4s ease-in-out 1.4s infinite alternate splash-breathe;position:absolute}.splash-brand{aspect-ratio:1815/676;will-change:transform;width:min(56vw,14rem);animation:.9s cubic-bezier(.65,0,.35,1) 1s both splash-brand-shift;position:relative}.splash-mark,.splash-word{will-change:transform;background:#f8f7f4;height:100%;position:absolute;top:0;overflow:hidden;-webkit-mask:url(/logoBrik.png) 50%/contain no-repeat;mask:url(/logoBrik.png) 50%/contain no-repeat}.splash-mark{clip-path:inset(0 67% 0 0);transform-origin:16%;width:100%;animation:.8s cubic-bezier(.34,1.4,.64,1) .3s both splash-mark-in;left:0}.splash-word-window{position:absolute;inset:0 0 0 33%;overflow:hidden}.splash-word{width:149.25%;animation:.9s cubic-bezier(.65,0,.35,1) 1s both splash-word-in;left:-49.25%}.splash-shine{will-change:transform;background:linear-gradient(110deg,#0000 38%,#a8dccf 50%,#0000 62%);animation:1.6s ease-in-out 2s 2 both splash-shine;position:absolute;inset:0;transform:translate(-100%)}.splash-tagline{letter-spacing:.32em;text-transform:uppercase;color:#f8f7f4b8;will-change:transform, opacity;margin:1.6rem 0 0;font-size:.7rem;font-weight:500;animation:.7s cubic-bezier(.22,1,.36,1) 2.4s both splash-rise}@keyframes splash-drift{0%{transform:translate(0)scale(1)}to{transform:translate(-8%,6%)scale(1.12)}}@keyframes splash-glow-in{0%{opacity:0;transform:scale(.4)}}@keyframes splash-breathe{to{transform:scale(1.12)}}@keyframes splash-brand-shift{0%{transform:translate(34%)}}@keyframes splash-mark-in{0%{opacity:0;transform:scale(.5)rotate(-12deg)}60%{opacity:1}}@keyframes splash-word-in{0%{transform:translate(-67%)}}@keyframes splash-shine{0%{transform:translate(-100%)}60%,to{transform:translate(100%)}}@keyframes splash-rise{0%{opacity:0;transform:translateY(8px)}}@media (prefers-reduced-motion:reduce){#splash,.splash-stage{transition:none}#splash *,#splash :before{animation:none!important}}</style>
  <script type="module" crossorigin src="/assets/index-Bjb3QSVK.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CBsMt7Rp.css">
</head>

<body>
  <div id="splash">
    <span class="splash-blob splash-blob-a"></span>
    <span class="splash-blob splash-blob-b"></span>

    <div class="splash-stage">
      <span class="splash-glow"></span>
      <div class="splash-brand" role="img" aria-label="Brik">
        <span class="splash-mark"><span class="splash-shine"></span></span>

      </div>

    <p class="splash-tagline">Garimpe ofertas</p>

  <!-- Conteúdo estático para quem lê o HTML sem rodar o JavaScript (a revisão
       da tela de consentimento OAuth do Google procura o nome "Brik" escrito
       na página inicial). O React substitui tudo isto ao montar. -->
  <div id="root">
    <main style="max-width:40rem;margin:0 auto;padding:2rem 1rem;font-family:Rubik,ui-sans-serif,system-ui,sans-serif;color:#0a3540">
      <h1>Brik</h1>
      <p>
        O Brik analisa anúncios públicos de produtos usados, como os da OLX, calcula o preço médio de cada
        modelo e mostra só os que estão abaixo da média. É para quem quer comprar barato para uso próprio
        ou para revender com lucro.
      </p>
      <p>
        <a href="/sobre">Sobre o Brik</a> ·
        <a href="/privacidade">Política de Privacidade</a>
      </p>
    </main>
  </div>
  <!-- Sem JavaScript, o main.jsx não remove a splash; ela cobriria o texto acima. -->
  <noscript><style>#splash{display:none}</style></noscript>
</body>

</html>
