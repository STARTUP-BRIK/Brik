name: Verificar strikes

# Confere no OLX os anúncios que levaram strike (sumiram da raspagem completa) e
# apaga do banco os que saíram do ar (vendidos/removidos). Os ainda no ar voltam
# a strike 0; os inconclusivos (bloqueio) ficam pra próxima execução.
# Sem schedule: quem dispara é o pg_cron do Supabase (job 'verificar-strikes'),
# todo dia ao meio-dia em Recife = 15h00 UTC ('0 15 * * *').
on:
  workflow_dispatch:

# Grupo próprio: não disputa a fila da raspagem (no GitHub, um disparo pendente
# substitui o outro do mesmo grupo). Rodar ao mesmo tempo que ela é seguro: aqui
# só se apaga anúncio que o OLX confirmou fora do ar.
concurrency:
  group: verificar-strikes
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências do scraper (Python)
        run: pip install -r scraper/requirements.txt

      - name: Instalar dependências do worker (Node)
        working-directory: worker
        run: npm install

      - name: Instalar tela virtual (Xvfb)
        run: command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)

      # Sem --headless: o OLX bloqueia o Chrome headless (ver raspagem-base.yml).
      - name: Verificar anúncios com strike
        working-directory: worker
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node worker.js --verificar-strikes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHON_EXECUTABLE: python
          PYTHON_SCRIPT_PATH: ${{ github.workspace }}/scraper/app.py
